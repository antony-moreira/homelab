# Netdata tuning — reduces aggressive polling by the cgroups/docker plugin
#
# PROBLEM: by default netdata collects cgroups (metrics for every container)
# every 1s. On a weak CPU (N5095) this pushes dockerd+containerd to ~156%
# combined, generating heat (Leon reached 88°C).
#
# SOLUTION: lower the collection frequency. Measured gain: dockerd 67%→1%, -8°C.
#
# APPLY: netdata.conf lives in the `monitoring-stack_netdataconfig` Docker volume
# (NOT synced by Dockhand). Apply manually:
#
#   docker exec netdata bash -c 'cat >> /etc/netdata/netdata.conf << EOF
#   <content below>
#   EOF'
#   docker restart netdata
#
# Verify: docker exec netdata grep -A1 'plugin:cgroups' /etc/netdata/netdata.conf

[global]
    # Global collection every 5s (default 1s)
    update every = 5

[plugin:cgroups]
    # Container metrics every 30s (default 1s) — the main saving
    update every = 30
    enable new cgroups detected at runtime = yes

[plugin:proc:/proc/diskstats]
    update every = 10
